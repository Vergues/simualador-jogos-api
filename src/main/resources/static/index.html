<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Futebol ao Vivo</title>

    <link
        rel="stylesheet"
        href="style.css?v=3"
    >
</head>

<body>

    <header class="topo">

        <div class="logo">
            Futebol ao Vivo
        </div>

        <nav class="menu">
            <a href="#hoje">Hoje</a>
            <a href="#proximos">Próximos</a>
        </nav>

    </header>


    <main class="container">

        <section id="hoje">

            <div class="titulo-secao">

                <div>
                    <h1>Jogos de hoje</h1>

                    <p>
                        Partidas agendadas para hoje
                    </p>
                </div>

            </div>

            <div id="listaHoje">
            </div>

        </section>


        <section
            id="proximos"
            class="secao"
        >

            <div class="titulo-secao">

                <div>
                    <h2>Próximos jogos</h2>

                    <p>
                        Próximas partidas do Brasileirão
                    </p>
                </div>

            </div>

            <div id="listaProximos">
            </div>

        </section>

    </main>


    <script src="app.js?v=3"></script>

</body>

</html>
