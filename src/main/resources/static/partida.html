<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Partida ao Vivo</title>

    <link
        rel="stylesheet"
        href="partida.css"
    >

</head>

<body>

    <header class="topo">

        <a
            href="/"
            class="voltar"
        >
            ← Voltar
        </a>

        <h1>
            Futebol ao Vivo
        </h1>

    </header>


    <main class="container">

        <section class="partida">

            <div class="info-superior">

                <span id="campeonato">
                </span>

                <span id="status">
                </span>

            </div>


            <div class="placar">

                <div class="time">

                    <h2 id="timeCasa">
                    </h2>

                    <span id="siglaCasa">
                    </span>

                </div>


                <div class="resultado">

                    <span id="golsCasa">
                        0
                    </span>

                    <span class="separador">
                        x
                    </span>

                    <span id="golsFora">
                        0
                    </span>

                </div>


                <div class="time">

                    <h2 id="timeFora">
                    </h2>

                    <span id="siglaFora">
                    </span>

                </div>

            </div>


            <div
                id="minuto"
                class="minuto"
            >
            </div>

        </section>


        <section class="estatisticas">

            <h2>
                Estatísticas
            </h2>

            <div class="nomes-estatisticas">

                <span id="nomeEstatisticaCasa">
                </span>

                <span id="nomeEstatisticaFora">
                </span>

            </div>

            <div id="listaEstatisticas">
            </div>

        </section>


        <section class="timeline">

            <h2>
                Eventos da partida
            </h2>

            <div id="eventos">
            </div>

        </section>

    </main>


    <script src="partida.js"></script>

</body>

</html>
